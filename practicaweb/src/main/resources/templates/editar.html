<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Editar Producto</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="container mt-5">

    <h1 class="mb-4">
        Editar Producto
    </h1>

    <form th:action="@{/actualizar/{id}(id=${producto.id})}"
          th:object="${producto}"
          method="post">
        
        <div class="mb-3">
            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}" />
        </div>

        <div class="mb-3">

            <label class="form-label">
                Nombre
            </label>

            <input type="text"
                   th:field="*{nombre}"
                   class="form-control"
                   required>

        </div>

        <div class="mb-3">

            <label class="form-label">
                Precio
            </label>

            <input type="number"
                   step="0.01"
                   th:field="*{precio}"
                   class="form-control"
                   required>

        </div>

        <div class="mb-3">

            <label class="form-label">
                Stock
            </label>

            <input type="number"
                   th:field="*{stock}"
                   class="form-control"
                   required>

        </div>

        <div class="mb-3">

            <label class="form-label">
                Categoria
            </label>

            <input type="text"
                   th:field="*{categoria}"
                   class="form-control"
                   required>

        </div>

        <button type="submit"
                class="btn btn-primary">

            Actualizar

        </button>

        <a href="/"
           class="btn btn-secondary">

            Volver

        </a>

    </form>

</body>
</html>
