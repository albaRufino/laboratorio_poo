<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Inventario</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="container mt-5">

    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">

            <span class="navbar-brand mb-0 h1">
                Super Market
            </span>

        </div>
    </nav>
    
    <h1 class="mb-4">
        Sistema de Gestion de inventario
    </h1>

    <div class="card p-4 mb-4">

        <h3 class="mb-3">
            Agregar Producto
        </h3>

        <form action="/guardar" method="post">

            <div class="mb-3">
            <input type="hidden"
                        accept=""th:name="${_csrf.parameterName}"
                        accesskey=""th:value="${_csrf.token}" />    
            </div>
            
            <div class="mb-3">

                <label class="form-label">
                    Nombre
                </label>

                <input type="text"
                       name="nombre"
                       class="form-control"
                       required>

            </div>
            
            <div class="mb-3">

                <label class="form-label">
                    Precio
                </label>

                <input type="number"
                       step="0.01"
                       name="precio"
                       class="form-control"
                       required>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Stock
                </label>

                <input type="number"
                       name="stock"
                       class="form-control"
                       required>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Categoria
                </label>

                <input type="text"
                       name="categoria"
                       class="form-control"
                       required>

            </div>

            <button type="submit"
                    class="btn btn-success">

                Guardar Producto

            </button>

        </form>

    </div>

    <div class="card p-3 shadow">

        <h3 class="mb-3">
            Lista de Productos
        </h3>

        <table class="table table-striped table-hover">

            <thead class="table-dark">

                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Precio</th>
                    <th>Stock</th>
                    <th>Categoria</th>
                    <th>Acciones</th>
                </tr>

            </thead>

            <tbody>

                <tr th:each="producto : ${productos}">

                    <td th:text="${producto.id}"></td>

                    <td th:text="${producto.nombre}"></td>

                    <td th:text="${producto.precio}"></td>

                    <td th:text="${producto.stock}"></td>

                    <td th:text="${producto.categoria}"></td>

                    <td>

                        <a th:href="@{/editar/{id}(id=${producto.id})}"
                           class="btn btn-warning btn-sm">

                            Editar

                        </a>

                        <a th:href="@{/eliminar/{id}(id=${producto.id})}"
                           class="btn btn-danger btn-sm">

                            Eliminar

                        </a>

                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</body>
</html>
